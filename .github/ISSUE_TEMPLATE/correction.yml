name: Correct or remove a listing
description: Report a broken link, changed product, unsupported claim, or discontinued app.
title: 'Correction: '
body:
  - type: input
    id: app
    attributes:
      label: App name
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change and why?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting sources
      description: Include official URLs and the date you checked them.
    validations:
      required: true
